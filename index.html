const $=id=>document.getElementById(id),sel=new Set(C.map((_,i)=>i)),seen=new Set();
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>["home","quiz","res"].forEach(s=>$(s).hidden=s!==id);
let S=null;
C.forEach((c,i)=>{const l=document.createElement("label");l.className="card ch "+(c.m?"hi":"so");
l.innerHTML=`<input type="checkbox" checked><span>${c.t.split(" · ")[1]}<small>${c.q.length} questions</small></span>`;
l.querySelector("input").onchange=e=>{e.target.checked?sel.add(i):sel.delete(i);upd()};$("l"+c.m).appendChild(l)});
const boxes=()=>[...document.querySelectorAll("label.ch input")];
function upd(){const n=[...sel].reduce((s,i)=>s+C[i].q.length,0);$("go").disabled=!n;
$("info").textContent=n?`${n} questions disponibles dans ta sélection${n<20?" (série réduite)":""}.`:"Coche au moins un chapitre."}
$("all").onclick=()=>{boxes().forEach((b,i)=>{b.checked=true;sel.add(i)});upd()};
$("none").onclick=()=>{boxes().forEach(b=>b.checked=false);sel.clear();upd()};
$("go").onclick=start;$("qt2").onclick=()=>{if(confirm("Abandonner cette série ?"))goHome()};
function goHome(){boxes().forEach((b,i)=>b.checked=sel.has(i));upd();show("home");scrollTo(0,0)}
function start(){let pool=[];[...sel].forEach(c=>C[c].q.forEach((q,i)=>pool.push({c,k:c*100+i,q})));
pool=sh(pool);pool=[...pool.filter(p=>!seen.has(p.k)),...pool.filter(p=>seen.has(p.k))].slice(0,20);
S={items:sh(pool).map(p=>({c:p.c,k:p.k,q:p.q[0],ans:p.q[1],ex:p.q[5],opts:sh(p.q.slice(1,5)),pick:null})),i:0};
S.items.forEach(x=>seen.add(x.k));show("quiz");draw()}
function draw(){const x=S.items[S.i],n=S.items.length,c=C[x.c];
$("prog").textContent=`Question ${S.i+1} sur ${n}`;$("pb").style.width=(S.i/n*100)+"%";
const t=$("tg");t.textContent=c.t.split(" · ")[1];t.parentElement.className="card "+(c.m?"hi":"so");t.style.color="var(--c)";
$("qt").textContent=x.q;$("nx").disabled=x.pick===null;$("nx").textContent=S.i==n-1?"Voir mon résultat":"Suivant";
const o=$("op");o.innerHTML="";x.opts.forEach(t=>{const b=document.createElement("button");b.className="opt"+(x.pick===t?" sel":"");b.textContent=t;
b.onclick=()=>{x.pick=t;draw()};o.appendChild(b)})}
$("nx").onclick=()=>{S.i++;S.i<S.items.length?draw():finish()};
function finish(){show("res");const it=S.items,ok=it.filter(x=>x.pick===x.ans),ko=it.filter(x=>x.pick!==x.ans),by={};
it.forEach(x=>{const b=by[x.c]||(by[x.c]=[0,0]);b[1]++;if(x.pick===x.ans)b[0]++});
const card=(x,g)=>`<div class="card rv ${g?"g":""}"><p><b>${x.q}</b></p>${g?"":`<p>Ta réponse : <b class="w">${x.pick}</b></p>`}<p>Bonne réponse : <b class="a">${x.ans}</b></p><p>${x.ex}</p></div>`;
$("res").innerHTML=`<h1>Résultat</h1><p class="score">${ok.length} / ${it.length}</p><p class="s">${ko.length?"Relis les corrections ci-dessous, puis refais une série.":"Aucune erreur, bravo !"}</p>
<div class="card"><table>${Object.keys(by).map(c=>`<tr><td>${C[c].t}</td><td>${by[c][0]} / ${by[c][1]}</td></tr>`).join("")}</table></div>
<div class="row"><button class="p" id="again">Refaire avec la même sélection</button><button id="chg">Modifier les chapitres</button></div>
${ko.length?`<h2>Tes erreurs (${ko.length})</h2>${ko.map(x=>card(x,0)).join("")}`:""}
${ok.length?`<h2>Tes bonnes réponses (${ok.length})</h2>${ok.map(x=>card(x,1)).join("")}`:""}`;
$("again").onclick=start;$("chg").onclick=goHome;scrollTo(0,0)}
upd();
</script>
